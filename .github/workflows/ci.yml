# Tamiz CI (spec 001 FR-023, research R-12): one job named `ci` so branch protection on
# `main` requires a single status. Steps run in order and the job stops at the first
# failure: lint → typecheck → arch → test → build, then the privacy service's gates (spec
# 004 research R-06: ruff → mypy → import-linter → pytest → docker build). Commit messages
# are checked on pull requests. Actions are pinned to commit SHAs (Renovate keeps them current).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Commit messages (Conventional Commits)
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Architecture check
        run: pnpm arch

      - name: Test
        run: pnpm test --coverage

      - name: Build
        run: pnpm build

      - name: Set up uv (privacy service)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: services/privacy/uv.lock

      - name: "Privacy: install"
        working-directory: services/privacy
        run: uv sync --frozen

      - name: "Privacy: lint and format"
        working-directory: services/privacy
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: "Privacy: typecheck"
        working-directory: services/privacy
        run: uv run mypy

      - name: "Privacy: architecture check"
        working-directory: services/privacy
        run: uv run lint-imports

      - name: "Privacy: test"
        working-directory: services/privacy
        run: uv run pytest --cov --cov-report=term

      - name: "Privacy: docker build"
        run: docker build -t tamiz-privacy services/privacy

      # - name: Evals (feature 007, T-007-xx)
      #   run: pnpm evals

      # - name: Docker build (OPS: whole stack)
      #   run: docker compose build
