[project]
name = "tamiz-privacy"
version = "0.1.0"
description = "Tamiz privacy service: personal-data detection and reversible anonymization for Spanish text."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "es-core-news-lg",
  "fastapi>=0.120",
  "presidio-analyzer>=2.2.366,<2.3",
  "pydantic>=2.12",
  "pydantic-settings>=2.11",
  "spacy>=3.8.7,<3.9",
  "uvicorn>=0.38",
]

[dependency-groups]
dev = [
  "faker>=37",
  "httpx>=0.28",
  "hypothesis>=6.140",
  "import-linter>=2.5",
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-cov>=7.0",
  "python-stdnum>=2.1",
  "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "privacy"

[tool.uv.sources]
es-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_lg-3.8.0/es_core_news_lg-3.8.0-py3-none-any.whl" }

# --- Ruff -------------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # pytest asserts
"scripts/generate_corpus.py" = ["S311"] # seeded, reproducible test data; not cryptography

# --- mypy (strict; constitution VII) ----------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "privacy.*"
disallow_any_explicit = true

# --- pytest -----------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "-ra", "--import-mode=importlib"]
markers = [
  "nlp: loads the real spaCy model (slow, ~550 MB)",
  "metrics: detection metrics over the synthetic corpus, with thresholds",
]

[tool.coverage.run]
source = ["privacy"]
branch = true

# --- import-linter (constitution I; research R-05) --------------------------------------

[tool.importlinter]
root_package = "privacy"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: main > api | infrastructure > application > domain"
type = "layers"
layers = [
  "privacy.main",
  "privacy.api | privacy.infrastructure",
  "privacy.application",
  "privacy.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application import no framework or library"
type = "forbidden"
source_modules = ["privacy.domain", "privacy.application"]
forbidden_modules = [
  "fastapi",
  "presidio_analyzer",
  "pydantic",
  "pydantic_settings",
  "spacy",
  "starlette",
  "uvicorn",
]
