# Local-only routing policy for Tamiz (feature 002): every request goes to the local
# Ollama model and nothing leaves the machine. Needs only OLLAMA_BASE_URL (which has a
# default). Use it with TAMIZ_POLICY_FILE=policies/local-only.yaml.

id: local-only
version: 3
defaultTimeoutMs: 60000

targets:
  - id: ollama-llama
    provider: ollama
    model: llama3.1:8b
    region: local
    residency: local
    pricing: { inputUsdPerMillion: 0, outputUsdPerMillion: 0 }

# Everything is local already, so every level may route as usual; critical says so
# explicitly, which is what the boot check requires (spec 005 FR-004).
privacy:
  onDetectorError: restrict_to_local
  localRoute: [ollama-llama]
  levels:
    none:     { action: allow }
    low:      { action: allow }
    high:     { action: allow }
    critical: { action: restrict_to_local }

rules: []

default:
  route: [ollama-llama]
