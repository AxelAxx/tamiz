openapi: 3.1.0
info:
  title: Tamiz Gateway
  version: 0.1.0
  description: >-
    Review projection of the contracts defined as Zod schemas in packages/contracts.
    Not generated, not served. See README.md in this folder.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness of the gateway
      responses:
        "200":
          description: Gateway is running
          headers:
            x-request-id:
              schema: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
              example: { status: ok, version: 0.1.0, uptimeMs: 12345 }
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: OpenAI-compatible chat completion (non-streaming subset; implemented in feature 002)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatCompletionRequest" }
      responses:
        "200":
          description: Completion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCompletionResponse" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    RequestId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9_-]+$"
    Milliseconds:
      type: integer
      minimum: 0
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version, uptimeMs]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string, minLength: 1 }
        uptimeMs: { $ref: "#/components/schemas/Milliseconds" }
        checks:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/HealthCheck" }
    HealthCheck:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name: { type: string, minLength: 1 }
        status: { type: string, enum: [ok, degraded, down] }
        detail: { type: string }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [type, message]
          properties:
            type:
              type: string
              enum: [invalid_request, unauthorized, not_found, rate_limited, provider_error, policy_blocked, internal]
            message: { type: string }
            requestId: { $ref: "#/components/schemas/RequestId" }
    ChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role: { type: string, enum: [system, user, assistant] }
        content: { type: string }
    ChatCompletionRequest:
      type: object
      additionalProperties: false
      required: [model, messages]
      properties:
        model: { type: string, minLength: 1 }
        messages:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ChatMessage" }
        temperature: { type: number, minimum: 0, maximum: 2 }
        max_tokens: { type: integer, minimum: 1 }
        stream: { type: boolean, enum: [false] }
        user: { type: string, maxLength: 256 }
    ChatCompletionChoice:
      type: object
      additionalProperties: false
      required: [index, message, finish_reason]
      properties:
        index: { type: integer, minimum: 0 }
        message: { $ref: "#/components/schemas/ChatMessage" }
        finish_reason: { type: string, enum: [stop, length, content_filter] }
    ChatCompletionUsage:
      type: object
      additionalProperties: false
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
    ChatCompletionResponse:
      type: object
      additionalProperties: false
      required: [id, object, created, model, choices, usage]
      properties:
        id: { type: string, minLength: 1 }
        object: { type: string, enum: [chat.completion] }
        created: { type: integer, minimum: 0 }
        model: { type: string, minLength: 1 }
        choices:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ChatCompletionChoice" }
        usage: { $ref: "#/components/schemas/ChatCompletionUsage" }
