# Local stack for Tamiz. Feature 003 (T-003-06) adds the key-value store that shares
# circuit breaker state between gateway instances; feature 004 adds the privacy service;
# feature 006 adds Postgres and Jaeger; the OPS task adds the gateway and Ollama.
#
#   docker compose up valkey
#   REDIS_URL=redis://localhost:6379 pnpm --filter @tamiz/gateway dev
#   docker compose up privacy
#   docker compose up postgres   # DATABASE_URL=postgres://tamiz:tamiz@localhost:5432/tamiz (feature 006)
#   docker compose up jaeger     # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318, UI http://localhost:16686

services:
  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Personal-data detection and anonymization (spec 004). It has no authentication, so it
  # is reachable only on the compose network (http://privacy:8001), never published.
  # For local debugging, run it with uv instead (services/privacy/README.md).
  privacy:
    build: services/privacy
    expose:
      - "8001"
    environment:
      PRIVACY_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # Audit log and API keys (spec 006). Local development credentials only.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tamiz
      POSTGRES_PASSWORD: tamiz
      POSTGRES_DB: tamiz
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamiz -d tamiz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Traces (spec 006 FR-011): OTLP/HTTP on 4318, the UI on 16686. Spans carry no content.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686"
      - "4318:4318"
    restart: unless-stopped

volumes:
  postgres-data:
